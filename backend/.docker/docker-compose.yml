services:
  database:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build:
      context: ../.
      dockerfile: .docker/Dockerfile
    env_file:
      - .env
    depends_on:
      - database
    volumes:
      - ../src:/app/src
    ports:
      - "8000:8000"


volumes:
  pg_data: